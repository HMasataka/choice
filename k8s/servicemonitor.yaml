# Prometheus ServiceMonitor for SFU
# Per tasks.md 4.1.3: Configure Prometheus ServiceMonitor for Kubernetes
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sfu-monitor
  labels:
    app: sfu
    release: prometheus
spec:
  selector:
    matchLabels:
      app: sfu
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# PrometheusRule for SFU alerts
# Per tasks.md 4.1.3: Configure alerting rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sfu-alerts
  labels:
    app: sfu
    release: prometheus
spec:
  groups:
    - name: sfu.rules
      rules:
        # CPU Usage Warning
        - alert: SFUHighCPUUsage
          expr: |
            (sum(rate(container_cpu_usage_seconds_total{container="sfu"}[5m])) by (pod)
            / sum(container_spec_cpu_quota{container="sfu"}/container_spec_cpu_period{container="sfu"}) by (pod)) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on SFU pod {{ $labels.pod }}"
            description: "CPU usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

        # CPU Usage Critical
        - alert: SFUCriticalCPUUsage
          expr: |
            (sum(rate(container_cpu_usage_seconds_total{container="sfu"}[5m])) by (pod)
            / sum(container_spec_cpu_quota{container="sfu"}/container_spec_cpu_period{container="sfu"}) by (pod)) * 100 > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Critical CPU usage on SFU pod {{ $labels.pod }}"
            description: "CPU usage is above 95% (current: {{ $value | printf \"%.1f\" }}%)"

        # Memory Usage Warning
        - alert: SFUHighMemoryUsage
          expr: |
            (container_memory_working_set_bytes{container="sfu"}
            / container_spec_memory_limit_bytes{container="sfu"}) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on SFU pod {{ $labels.pod }}"
            description: "Memory usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

        # Pod Restart Warning
        - alert: SFUPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{container="sfu"}[10m]) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "SFU pod {{ $labels.pod }} is restarting frequently"
            description: "Pod has restarted {{ $value | printf \"%.0f\" }} times in the last 10 minutes"

        # Note: HTTP error rate alert is commented out as http_requests_total
        # metric is not yet implemented. Uncomment when HTTP metrics are added.
        # - alert: SFUHighErrorRate
        #   expr: |
        #     (sum(rate(http_requests_total{job="sfu", status=~"5.."}[5m]))
        #     / sum(rate(http_requests_total{job="sfu"}[5m]))) * 100 > 1
        #   for: 5m
        #   labels:
        #     severity: warning
        #   annotations:
        #     summary: "High error rate on SFU"
        #     description: "HTTP error rate is above 1%"

        # Low Room Count Warning
        # Note: sfu_connections_total is a Gauge, so we monitor absolute values
        - alert: SFULowConnectionCount
          expr: sfu_connections_total < 1 and sfu_rooms_total > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Rooms exist but no connections on SFU"
            description: "There are {{ $value }} rooms but no active connections"

        # High Packet Loss
        - alert: SFUHighPacketLoss
          expr: |
            (rate(sfu_packets_lost_total[5m])
            / (rate(sfu_packets_received_total[5m]) + rate(sfu_packets_lost_total[5m]))) * 100 > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High packet loss rate on SFU"
            description: "Packet loss rate is above 5% (current: {{ $value | printf \"%.2f\" }}%)"

        # No Active Rooms (potential issue if expected)
        - alert: SFUNoActiveRooms
          expr: sfu_rooms_total == 0
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "No active rooms on SFU"
            description: "There have been no active rooms for 30 minutes"

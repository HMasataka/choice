apiVersion: v1
kind: ServiceAccount
metadata:
  name: sfu
  namespace: choice-sfu
  labels:
    app.kubernetes.io/name: choice-sfu
    app.kubernetes.io/component: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sfu
  namespace: choice-sfu
  labels:
    app.kubernetes.io/name: choice-sfu
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sfu
  namespace: choice-sfu
  labels:
    app.kubernetes.io/name: choice-sfu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sfu
subjects:
  - kind: ServiceAccount
    name: sfu
    namespace: choice-sfu

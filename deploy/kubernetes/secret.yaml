apiVersion: v1
kind: Secret
metadata:
  name: sfu-secrets
  namespace: choice-sfu
  labels:
    app.kubernetes.io/name: choice-sfu
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # JWT Authentication Settings
  # For production: Use external secret management (e.g., Vault, AWS Secrets Manager)
  # These correspond to environment variables in pkg/config/config.go applyEnvOverrides
  jwt-jwks-url: "https://auth.example.com/.well-known/jwks.json"
  jwt-issuer: "https://auth.example.com"
  jwt-audience: "sfu.example.com"
  # Redis password (optional, if Redis requires authentication)
  redis-password: ""
